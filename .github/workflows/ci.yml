name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths: ["src/**", "test/**", "fixtures/**", "package.json", "bun.lock", "tsconfig.json"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Pipeline offline (fixtures)
        # --now fixo: os fixtures são um snapshot de 2026-08-17; sem isso o passo ficaria
        # vermelho quando todos os eventos do snapshot passassem.
        run: bun src/index.ts eventos --skip-db --fixture fixtures --now 2026-08-17T15:00:00-03:00
