name: Eventos oficiais UFSC

# Baixa os calendários iCal da Agecom e dos campi, normaliza e manda pra Edge Function
# `events-admin` do Supabase (ação ufsc-upsert; a function revalida e força
# source=ufsc/status=approved). Depois commita o snapshot data/eventos.json via deploy
# key SSH — push com deploy key conta como atividade e impede o GitHub de desabilitar
# o cron (regra dos 60 dias; commits do GITHUB_TOKEN NÃO contam).
#
# Dois jobs: `eventos` roda bun install + o pipeline SEM a deploy key (dependência
# comprometida não consegue pushar) e publica o snapshot como artifact; `commit`
# faz checkout com a deploy key e só roda comandos git.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Só validar (não grava nem poda)"
        type: boolean
        default: false
  # Sem schedule desde 2026-11-24: os sites *.ufsc.br dão 403 aos runners do GitHub, então
  # a sincronização agendada roda no cron do VPS (/opt/noticias-runner/run.sh, 06:00 e
  # 15:00 BRT), que também commita o snapshot. Este workflow fica para rodar à mão.

permissions:
  contents: read

concurrency:
  group: eventos-ufsc
  cancel-in-progress: false

jobs:
  eventos:
    name: Sincronizar eventos
    runs-on: ubuntu-latest
    # Export fora do ar: até ~6 min de retries por fonte + plano B pelas páginas.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Testes offline (fixtures)
        run: bun test
      - name: Sincronizar
        env:
          EVENTS_ADMIN_URL: ${{ secrets.EVENTS_ADMIN_URL }}
          EVENTS_ADMIN_TOKEN: ${{ secrets.EVENTS_ADMIN_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            bun src/index.ts eventos --dry-run
          else
            bun src/index.ts eventos
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !inputs.dry_run }}
        with:
          name: snapshot-eventos
          path: data/eventos.json
          if-no-files-found: error
          overwrite: true # reruns reenviam o mesmo nome

  commit:
    name: Commit do snapshot (keep-alive)
    needs: eventos
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # O push usa a deploy key (SSH), não o GITHUB_TOKEN → basta leitura.
    # Este job só roda comandos git: nada de bun install / código de terceiros aqui.
    steps:
      # `ref: main` garante a ponta da branch mesmo em reruns.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ssh-key: ${{ secrets.NEWS_COMMIT_SSH_KEY }}
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: snapshot-eventos
          path: ${{ runner.temp }}/snapshot
      - name: Commit e push
        env:
          SNAPSHOT_DIR: ${{ runner.temp }}/snapshot
        run: |
          git config user.name "noticias-ufsc-bot"
          git config user.email "noticias-ufsc-bot@users.noreply.github.com"
          # À prova de corrida/rerun: realinha na ponta da main e reconstrói o commit por cima.
          for i in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p data
            cp "$SNAPSHOT_DIR/eventos.json" data/eventos.json
            date -u +"%Y-%m-%dT%H:%M:%SZ" > data/last-run.txt
            git add data/
            if git diff --cached --quiet; then
              echo "Nada para commitar."
              exit 0
            fi
            git commit -m "chore: atualiza eventos ($(date -u +%F))"
            if git push origin main; then
              exit 0
            fi
            echo "Push falhou (corrida?); tentativa $i/3…"
          done
          echo "::error::Não foi possível pushar o snapshot."
          exit 1
